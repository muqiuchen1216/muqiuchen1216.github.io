<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1600" role="img" aria-label="雨窗，城市在玻璃的另一侧">
  <defs>
    <linearGradient id="rain-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#243638"/>
      <stop offset="0.46" stop-color="#18282b"/>
      <stop offset="1" stop-color="#0b1416"/>
    </linearGradient>
    <radialGradient id="rain-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9b37f" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#c98955" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c98955" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rain-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ba9ad" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8ba9ad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rain-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c9c8" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#b8c9c8" stop-opacity="0.06"/>
      <stop offset="0.36" stop-color="#d6dfdb" stop-opacity="0.13"/>
      <stop offset="0.48" stop-color="#b8c9c8" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#b8c9c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rain-vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.42" stop-color="#050b0c" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#050b0c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#050b0c" stop-opacity="0.58"/>
    </radialGradient>
    <filter id="rain-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="rain-blur-big" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="rain-blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1280" height="1600" fill="url(#rain-bg)"/>
  <rect width="1280" height="1600" fill="url(#rain-glass)"/>

  <g filter="url(#rain-blur-big)" opacity="0.85">
    <circle cx="910" cy="330" r="148" fill="url(#rain-warm)"/>
