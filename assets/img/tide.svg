  <g fill="#dfe0d6" opacity="0.42">
    <path d="M505 255 q8 -7 16 0 q8 -6 14 1 q-15 7 -30 -1 Z"/>
    <path d="M548 281 q6 -5 12 0 q6 -5 11 1 q-12 5 -23 -1 Z"/>
    <path d="M465 296 q5 -4 10 0 q5 -4 9 1 q-10 4 -19 -1 Z"/>
  </g>

  <rect width="2350" height="1000" fill="url(#tide-vignette)"/>
</svg>
