<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2350 1000" role="img" aria-label="潮间，海面上的晨光">
  <defs>
    <linearGradient id="tide-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dad6cb"/>
      <stop offset="0.46" stop-color="#cdd0c8"/>
      <stop offset="0.82" stop-color="#bcc3bb"/>
      <stop offset="1" stop-color="#aab5ae"/>
    </linearGradient>
    <linearGradient id="tide-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#95a19a"/>
      <stop offset="0.2" stop-color="#7f8d86"/>
      <stop offset="0.56" stop-color="#5b6963"/>
      <stop offset="0.82" stop-color="#3d4a45"/>
      <stop offset="1" stop-color="#2a3531"/>
    </linearGradient>
    <radialGradient id="tide-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1d8" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#f8e4c2" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#f3ddba" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f3ddba" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tide-reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e7c9" stop-opacity="0.7"/>
      <stop offset="0.28" stop-color="#e9d2ad" stop-opacity="0.32"/>
      <stop offset="0.72" stop-color="#d9bd94" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#d9bd94" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tide-vignette" cx="0.5" cy="0.46" r="0.76">
      <stop offset="0.55" stop-color="#101512" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#101512" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#101512" stop-opacity="0.32"/>
    </radialGradient>
    <filter id="tide-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="tide-soft-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="2350" height="1000" fill="url(#tide-sky)"/>

  <g opacity="0.58" filter="url(#tide-soft)">
    <ellipse cx="610" cy="233" rx="560" ry="78" fill="#d9dad1"/>
    <ellipse cx="1590" cy="198" rx="690" ry="62" fill="#deddd4"/>
    <ellipse cx="1940" cy="330" rx="510" ry="58" fill="#c5cac1"/>
  </g>

  <circle cx="1570" cy="337" r="235" fill="url(#tide-glow)"/>
  <circle cx="1570" cy="337" r="43" fill="#f7e8ce" opacity="0.9" filter="url(#tide-soft-small)"/>
  <circle cx="1570" cy="337" r="20" fill="#fbf2e1" opacity="0.88"/>

  <path d="M0 455 C310 446 570 466 820 456 C1090 445 1300 462 1570 452 C1840 442 2100 458 2350 448 L2350 520 L0 520 Z"
