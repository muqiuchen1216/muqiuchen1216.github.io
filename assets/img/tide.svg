  <rect y="466" width="2350" height="534" fill="url(#tide-sea)"/>

  <path d="M0 476 C340 470 550 482 810 474 C1110 465 1350 479 1580 470 C1850 460 2140 474 2350 467 L2350 492 L0 492 Z"
