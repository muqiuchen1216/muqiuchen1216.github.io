  <g fill="none" stroke="#e8e7da" stroke-linecap="round">
    <path d="M0 520 C240 512 410 524 660 517 S1100 525 1350 516 S1800 522 2350 512" opacity="0.11"/>
    <path d="M0 548 C290 542 520 554 760 546 S1170 553 1420 544 S1950 550 2350 540" opacity="0.08"/>
    <path d="M0 586 C330 578 590 592 840 583 S1250 590 1530 581 S2050 588 2350 576" opacity="0.07"/>
    <path d="M0 632 C380 622 640 636 940 626 S1420 634 1710 623 S2160 630 2350 620" opacity="0.06"/>
    <path d="M0 688 C340 677 660 691 960 681 S1450 689 1770 678 S2190 686 2350 674" opacity="0.05"/>
    <path d="M0 754 C400 742 710 758 1020 747 S1540 755 1870 744 S2200 752 2350 740" opacity="0.045"/>
  </g>

  <g opacity="0.52">
    <ellipse cx="1570" cy="526" rx="126" ry="16" fill="url(#tide-reflect)" filter="url(#tide-soft-small)"/>
    <ellipse cx="1562" cy="578" rx="96" ry="26" fill="url(#tide-reflect)" filter="url(#tide-soft-small)"/>
    <ellipse cx="1578" cy="658" rx="70" ry="40" fill="url(#tide-reflect)" filter="url(#tide-soft-small)"/>
    <ellipse cx="1552" cy="760" rx="48" ry="58" fill="url(#tide-reflect)" filter="url(#tide-soft-small)"/>
    <ellipse cx="1580" cy="882" rx="27" ry="74" fill="url(#tide-reflect)" filter="url(#tide-soft-small)"/>
  </g>

  <path d="M0 862 C280 846 510 872 780 860 C1080 847 1320 868 1600 856 C1870 845 2110 862 2350 848 L2350 1000 L0 1000 Z"
        fill="#27332f" opacity="0.44" filter="url(#tide-soft-small)"/>
  <path d="M0 914 C300 896 560 921 850 907 C1130 894 1390 912 1680 900 C1940 889 2160 906 2350 893 L2350 1000 L0 1000 Z"
