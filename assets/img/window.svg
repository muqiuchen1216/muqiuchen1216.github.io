      <stop offset="1" stop-color="#5c4d3d"/>
    </linearGradient>
    <linearGradient id="light-patch" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f8edd8" stop-opacity="0.92"/>
      <stop offset="0.6" stop-color="#edd9b8" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#e4cda9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
