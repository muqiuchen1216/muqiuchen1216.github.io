<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" role="img" aria-label="静物，一只陶罐与一枝尤加利">
  <defs>
    <linearGradient id="still-wall" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ddd5c6"/>
      <stop offset="0.52" stop-color="#d3c9b8"/>
      <stop offset="1" stop-color="#bbae9a"/>
    </linearGradient>
    <linearGradient id="still-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7a68f"/>
      <stop offset="0.4" stop-color="#a08e77"/>
      <stop offset="1" stop-color="#786855"/>
    </linearGradient>
    <linearGradient id="still-vase" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#9a8f7c"/>
      <stop offset="0.28" stop-color="#b3a791"/>
      <stop offset="0.7" stop-color="#6e6555"/>
      <stop offset="1" stop-color="#4b4639"/>
    </linearGradient>
    <radialGradient id="still-light" cx="0.34" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="0.6"/>
      <stop offset="0.54" stop-color="#f6ecd9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f6ecd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="still-vignette" cx="0.5" cy="0.44" r="0.75">
      <stop offset="0.5" stop-color="#1d1913" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#1d1913" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#1d1913" stop-opacity="0.32"/>
    </radialGradient>
    <filter id="still-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="still-blur-small" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <path id="still-leaf" d="M0 0 C12 -11 34 -10 47 0 C34 10 12 11 0 0 Z"/>
  </defs>

  <rect width="1400" height="1400" fill="url(#still-wall)"/>
