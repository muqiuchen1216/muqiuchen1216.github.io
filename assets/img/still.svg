    <use href="#still-leaf" transform="translate(436 407) rotate(-8) scale(0.86)"/>
    <use href="#still-leaf" transform="translate(486 426) rotate(24) scale(0.62)"/>
    <use href="#still-leaf" transform="translate(760 302) rotate(-38) scale(0.8)"/>
    <use href="#still-leaf" transform="translate(548 252) rotate(-72) scale(0.72)"/>
